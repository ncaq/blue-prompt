# MarkdownがGFMとして壊れていないかを検査する設定。
#
# 見るのは書き方の好みではなく、
# 読み手のパーサが書き手の意図と違う構造を読み取ってしまう壊れ方だけです。
# 生成物はwikiruの記事の形をそのまま写しているため、
# 見出しの深さの飛びや強調の使い方のような文体の規則を有効にすると、
# 生成物の側では直しようのない指摘で埋まります。
# なので既定の規則を全て切ってから、壊れ方を捉える規則だけを足しています。
#
# 生成物はClaude CodeやOpen WebUIのKnowledgeでは生のテキストとして読まれ、
# 解釈が効くのはOpen WebUIのチャットのmarked(GFM)の描画です。
# どの経路でも同じ構造に読めるように、GFMの仕様で曖昧さ無く読める形を求めます。
# markdownlintはGFMの仕様に沿うmicromarkで解釈するので、その基準になります。
#
# フロントマターはmarkdownlintが読み飛ばします。
# YAMLとしての正しさは、生成物のビルドがYamlDotNetで全てのSKILL.mdを読むことで確かめています。
config:
  default: false

  # `(表示名)[URL]`のように括弧を取り違えたリンク。
  MD011: true
  # `#`の後に空白が無く見出しにならない行。
  MD018: true
  # 字下げされて見出しにならない行。
  MD023: true
  # 生のHTML。
  # 生成物は本文の文字列をMarkdownとして組み立てるため、
  # wikiの本文の`<`をエスケープし損ねると、そこから先がタグとして描画から消える。
  MD033: true
  # 強調の記号の内側の空白で強調にならないもの。
  MD037: true
  # 参照先が空のリンク。
  MD042: true
  # 字下げのコードブロック。
  # 生成物はフェンスしか使わないので、現れたら字下げの誤りで本文がコードになっている。
  MD046:
    style: fenced
  # 文書の中の見出しを指さない`#`のリンク。
  MD051: true
  # 定義の無い参照リンクと脚注。
  # 脚注の`[^1]`は省略形の参照リンクとして扱われるため、それも検査の対象にする。
  MD052:
    shortcut_syntax: true
  # 使われていないか重複している参照リンクと脚注の定義。
  # 重複した定義は後のものが捨てられる。
  MD053: true
  # 列の数が見出しの行と合わない表の行。
  # セルの中の縦棒のエスケープ漏れはここに現れる。
  MD056: true
  # 前後に空行の無い表。
  # 表の直後の行は空行が無いと表の行として吸い込まれる。
  MD058: true
