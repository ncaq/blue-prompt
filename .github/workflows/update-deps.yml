name: update-deps

# RenovateはfsprojとDirectory.Build.propsのPackageReferenceだけを書き換えるため、
# Nixのビルドが読むdeps.jsonが古いまま残り必須チェックのnix-fast-buildが落ちます。
# F#アナライザーのCLIツールのhashを持つfsharp-analyzers.jsonと、
# SDKが要求するFSharp.Coreの固定版を持つDirectory.Build.propsも同様です。
# Mendのホスト版RenovateはpostUpgradeTasksを実行できないので、
# 代わりにRenovateのブランチへこれらの再生成をコミットして追従させます。
#
# NuGetと関係のない更新でも起動しますが、
# 再生成したファイルに差分が無ければ何もせず終わるので対象を絞っていません。
# Renovateがrebaseで強制pushすると、
# GitHubが見る差分にはこのワークフローが足したコミットの巻き戻ししか現れないため、
# PackageReferenceを持つファイルで絞ると、
# 再生成したファイルが古いまま復旧しない経路ができてしまいます。
on:
  push:
    branches: [renovate/**]
  # Renovateの更新を待たずに動作を確かめられるようにします。
  # 選んだブランチへそのままコミットするので、
  # 試す時は`renovate/`で始まる使い捨てのブランチを使ってください。
  # masterを選んでもrulesetがpull requestを必須にしているため書き込みは弾かれます。
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-deps:
    name: update-deps
    runs-on: ubuntu-24.04
    permissions:
      contents: read # リポジトリコンテンツの読み取り
      id-token: write # niks3 OIDC認証
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ncaq/nix-composite-action@f10e5584c21da89d204a875b8b873d01217e774e # v3.0.5
      - run: nix run '.#update-deps'
      # GITHUB_TOKENが作ったコミットはワークフローを起動しない仕様のため、
      # 必須チェックのnix-fast-buildが最新のコミットで走らないまま止まります。
      # GitHub Appのトークンにはこの制限がありません。
      #
      # 発行を再生成の後に置いているのは、
      # 上のステップがRenovateの上げたばかりのNuGetパッケージをrestoreするためです。
      # パッケージに同梱された.propsや.targetsはMSBuildが評価するので、
      # 書き込みの権限を持つトークンをその区間の外へ出しています。
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.UPDATE_DEPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_DEPS_APP_PRIVATE_KEY }}
          permission-contents: write # 再生成したファイルのコミット
      - name: Commit regenerated files
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only -- Directory.Build.props deps.json fsharp-analyzers.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo '再生成したファイルに変更はありません。'
            exit 0
          fi
          additions=$(
            for file in "${files[@]}"; do
              jq --null-input --arg path "$file" --arg contents "$(base64 --wrap 0 "$file")" \
                '{ path: $path, contents: $contents }'
            done | jq --slurp .
          )
          # Gitでコミットせず`createCommitOnBranch`で作るのは、
          # GitHubがサーバ側で署名してVerifiedになるからです。
          # Renovate自身のコミットも同じくサーバ側で作られています。
          # contents APIと違い複数のファイルを1つのコミットへまとめられます。
          # `expectedHeadOid`により、
          # 再生成の間にブランチが進んでいた時は古い内容で上書きせず失敗します。
          jq --null-input \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg head "$(git rev-parse HEAD)" \
            --argjson additions "$additions" \
            '{
              query: "mutation ($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repository, branchName: $branch },
                  expectedHeadOid: $head,
                  message: { headline: "build(deps): NuGet依存の固定を再生成" },
                  fileChanges: { additions: $additions }
                }
              }
            }' |
            gh api graphql --input - --silent
