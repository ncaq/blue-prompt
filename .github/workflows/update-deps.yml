name: update-deps

# RenovateはfsprojのPackageReferenceだけを書き換えるため、
# Nixのビルドが読むdeps.jsonが古いまま残り必須チェックのnix-fast-buildが落ちます。
# Mendのホスト版RenovateはpostUpgradeTasksを実行できないので、
# 代わりにRenovateのブランチへdeps.jsonの再生成をコミットして追従させます。
#
# NuGetと関係のない更新でも起動しますが、
# deps.jsonに差分が無ければ何もせず終わるので対象を絞っていません。
# Renovateがrebaseで強制pushすると、
# GitHubが見る差分にはこのワークフローが足したコミットの巻き戻ししか現れないため、
# PackageReferenceを持つファイルで絞ると、
# deps.jsonが古いまま復旧しない経路ができてしまいます。
on:
  push:
    branches: [renovate/**]
  # Renovateの更新を待たずに動作を確かめられるようにします。
  # 選んだブランチへそのままコミットするので、
  # 試す時は`renovate/`で始まる使い捨てのブランチを使ってください。
  # masterを選んでもrulesetがpull requestを必須にしているため書き込みは弾かれます。
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-deps:
    name: update-deps
    runs-on: ubuntu-24.04
    permissions:
      contents: read # リポジトリコンテンツの読み取り
      id-token: write # niks3 OIDC認証
    timeout-minutes: 15
    steps:
      # GITHUB_TOKENが作ったコミットはワークフローを起動しない仕様のため、
      # 必須チェックのnix-fast-buildが最新のコミットで走らないまま止まります。
      # GitHub Appのトークンにはこの制限がありません。
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.UPDATE_DEPS_APP_ID }}
          private-key: ${{ secrets.UPDATE_DEPS_APP_PRIVATE_KEY }}
          permission-contents: write # deps.jsonのコミット
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ncaq/nix-composite-action@4f03c2b3b73e7e8b9c5163c36a452e7babf1edd4 # v3.0.3
      - run: nix run '.#update-deps'
      - name: Commit deps.json
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- deps.json; then
            echo 'deps.jsonに変更はありません。'
            exit 0
          fi
          # Gitでコミットせずcontents APIへ渡すのは、
          # GitHubがサーバ側で署名してVerifiedになるからです。
          # Renovate自身のコミットも同じ経路で作られています。
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/deps.json" \
            --field message='build(deps): deps.jsonを再生成' \
            --field content="$(base64 --wrap 0 deps.json)" \
            --field sha="$(git rev-parse 'HEAD:deps.json')" \
            --field branch="$GITHUB_REF_NAME" \
            --silent
