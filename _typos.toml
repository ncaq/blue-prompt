[files]
# plugins以下は綴りの検査から外す。
# 中身の大半はwikiruの記事から生成したファイルで、
# typosが英単語の綴り違いと判定した固有の表記を書き換えると、書かれている事実が変わってしまう。
# 実際にセーブデータの名前の「kei.sav」が「kei.save」に、
# 銃の拡張の規格の「M-LOK」が「M-LOOK」に書き換わっていた。
# 手で書くファイルも混ざっているが、生成物だけを選り分けると指定が込み入るので、ディレクトリごと外す。
extend-exclude = ["/plugins/"]

[default.extend-words]
# Part of "RGBa" (Pillow's pre-multiplied alpha RGB mode)
Ba = "Ba"
# HSA is something AMD uses for their GPUs
HSA = "HSA"
# 社名。分割で認識されなくなります。
Hashi = "Hashi"
# Immediately Invoked Function Expression (IIFE)の略語。camelCase分割で"IIF"をtypoと判定する。
IIF = "IIF"
# ブルーアーカイブの登場人物「リン」のスキル名character-rinの一部。
rin = "rin"
